name: Weekly grocery ad scan

on:
  schedule:
    # Kroger's weekly ad flips on Wednesday. 12:17 UTC is about 7am Central.
    # The Costco coupon book (~every 4 weeks) is picked up on whichever run follows it.
    - cron: "17 12 * * 3"
  workflow_dispatch: {}      # "Run workflow" button for manual runs

permissions:
  contents: write            # lets the job commit the new report

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Scan ads
        env:
          KROGER_CLIENT_ID: ${{ secrets.KROGER_CLIENT_ID }}
          KROGER_CLIENT_SECRET: ${{ secrets.KROGER_CLIENT_SECRET }}
        run: dealscan --config config.yaml
      - name: Publish summary
        run: cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit report
        run: |
          git config user.name "dealscan-bot"
          git config user.email "dealscan-bot@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "chore: grocery deal report $(date -u +%F)"
          git push
